<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص مرض السكري</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 500px; }
        h2 { color: #1f2937; text-align: center; margin-top: 0; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; color: #374151; font-weight: 600; font-size: 14px; }
        input { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; outline: none; }
        input:focus { border-color: #2563eb; ring: 2px #2563eb; }
        button { grid-column: span 2; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background-color: #1d4ed8; }
        #result-box { margin-top: 20px; padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; display: none; }
        .diabetic { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .non-diabetic { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

<div class="card">
    <h2>فحص احتمالية الإصابة بالسكري</h2>
    <form id="diabetesForm">
        <div class="grid">
            <div class="form-group">
                <label>مرات الحمل:</label>
                <input type="number" id="pregnancies" value="1" required>
            </div>
            <div class="form-group">
                <label>الجلوكوز:</label>
                <input type="number" step="any" id="glucose" value="120" required>
            </div>
            <div class="form-group">
                <label>ضغط الدم:</label>
                <input type="number" step="any" id="blood_pressure" value="70" required>
            </div>
            <div class="form-group">
                <label>سمك الجلد:</label>
                <input type="number" step="any" id="skin_thickness" value="20" required>
            </div>
            <div class="form-group">
                <label>الإنسولين:</label>
                <input type="number" step="any" id="insulin" value="79" required>
            </div>
            <div class="form-group">
                <label>مؤشر كتلة الجسم (BMI):</label>
                <input type="number" step="any" id="bmi" value="25.5" required>
            </div>
            <div class="form-group">
                <label>مؤشر الوراثة:</label>
                <input type="number" step="any" id="diabetes_pedigree" value="0.5" required>
            </div>
            <div class="form-group">
                <label>العمر:</label>
                <input type="number" id="age" value="30" required>
            </div>
            <button type="submit">إجراء التنبؤ</button>
        </div>
    </form>

    <div id="result-box"></div>
</div>

<script>
    document.getElementById('diabetesForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const data = {
        Pregnancies: parseInt(document.getElementById('pregnancies').value),
        Glucose: parseFloat(document.getElementById('glucose').value),
        BloodPressure: parseFloat(document.getElementById('blood_pressure').value),
        SkinThickness: parseFloat(document.getElementById('skin_thickness').value),
        Insulin: parseFloat(document.getElementById('insulin').value),
        BMI: parseFloat(document.getElementById('bmi').value),
        DiabetesPedigreeFunction: parseFloat(document.getElementById('diabetes_pedigree').value),
        Age: parseInt(document.getElementById('age').value)
    };

    const resultBox = document.getElementById('result-box');
    resultBox.style.display = 'block';
    resultBox.className = '';
    resultBox.innerText = 'جاري تحليل البيانات...';

    try {
        const response = await fetch('http://127.0.0.1:8000/api/predict', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify(data)
        });

        const resData = await response.json();

        if (response.ok) {
            const isDiabetic = resData.data.prediction === 1;
            resultBox.innerText = isDiabetic 
                ? 'النتيجة: احتمالية إصابة بالسكري (Diabetic)' 
                : 'النتيجة: سليم (Non-Diabetic)';
            resultBox.className = isDiabetic ? 'diabetic' : 'non-diabetic';
        } else {
            resultBox.innerText = 'حدث خطأ في البيانات المدخلة.';
        }
    } catch (error) {
        resultBox.innerText = 'تعذر الاتصال بالسيرفر! تأكد أن FastAPI يعمل.';
    }
});
</script>

</body>
</html>
